[project]
name = "taco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joel Meuleman", email = "j-jolabola@live.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
]

[project.scripts]
taco = "taco:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbstripout>=0.9.1",
]
