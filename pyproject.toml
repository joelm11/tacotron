[project]
name = "taco"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joel Meuleman", email = "j-jolabola@live.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "keras>=3.15.1",
    "librosa>=1.0.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "tensorflow[and-cuda]>=2.21.0",
    "tqdm>=4.70.1",
]

[project.scripts]
taco = "taco:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbstripout>=0.9.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
